<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>데쿠톡</title>
<meta name="theme-color" content="#17855a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="데쿠톡">
<style>
  :root { color-scheme: light dark; --bg: light-dark(#ecebe6, #121211); --card: light-dark(#fff, #1d1c1a); --ink: light-dark(#191816, #ecebe6); --sub: light-dark(#5a5853, #a9a69f); --acc: #17855a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.6 system-ui, 'Noto Sans KR', sans-serif; padding: 24px; }
  main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  img { width: 96px; height: 96px; border-radius: 24px; }
  h1 { margin: 0; font-size: 26px; }
  p { margin: 0; color: var(--sub); font-size: 15px; }
  .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 52px; border-radius: 14px;
         font: inherit; font-weight: 700; text-decoration: none; border: 0; cursor: pointer; }
  .pri { background: var(--acc); color: #fff; }
  .sec { background: var(--card); color: var(--ink); border: 1px solid light-dark(#d6d4cd, #34322e); }
  #install { display: none; }
  .tip { font-size: 13px; background: var(--card); border-radius: 12px; padding: 12px 14px; text-align: left; color: var(--sub); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1>데쿠톡</h1>
  <p id="msg">설치하면 앱 서랍에서 바로 열 수 있어요.</p>
  <button class="btn pri" id="install">앱으로 설치하기</button>
  <a class="btn sec" id="open">바로 열기</a>
  <div class="tip" id="tip">설치 버튼이 안 보이면 Chrome 오른쪽 위 ⋮ 메뉴에서 <b>앱 설치</b>(또는 홈 화면에 추가)를 눌러 주세요. 아이폰은 Safari 공유 버튼 → <b>홈 화면에 추가</b>예요.</div>
</main>
<script>
{
  // 데쿠 앱 주소 (claude.ai)
  const APP_URL = 'https://claude.ai/artifact/4hSv5s2RmySXJMgupUiM3k';
  document.getElementById('open').href = APP_URL;

  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (standalone) {
    // 앱 아이콘으로 열었을 때는 바로 데쿠 앱으로 이동
    document.getElementById('msg').textContent = '데쿠 부르는 중…';
    document.getElementById('tip').style.display = 'none';
    location.replace(APP_URL);
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  let deferred = null;
  const btn = document.getElementById('install');
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    btn.style.display = 'flex';
  });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    await deferred.userChoice.catch(() => null);
    deferred = null;
    btn.style.display = 'none';
  });
  addEventListener('appinstalled', () => {
    document.getElementById('msg').textContent = '설치됐어요! 앱 서랍에서 "데쿠톡"을 찾아 열어 보세요.';
  });
}
</script>
</body>
</html>
